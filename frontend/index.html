<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>GolfMinsk Live — скоринг, турниры и статистика</title>
    <meta name="description" content="Live-скоринг для Golf Club Minsk: ведите счёт раундов на 18 лунок, следите за турнирами 2026 и статистикой." />
    <meta name="author" content="Golf Club Minsk" />

    <meta property="og:title" content="GolfMinsk Live — скоринг, турниры и статистика" />
    <meta property="og:description" content="Live-скоринг для Golf Club Minsk: ведите счёт раундов, следите за турнирами 2026 и статистикой." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- PWA: открывается без браузера при добавлении на экран «Домой» -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GolfMinsk" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <style>
      /* Paint the correct background before React mounts / CSS loads, so
         there's no dark-then-light flash on first paint. */
      html, body, #root { background: #ffffff; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <!-- Disable all toast notifications globally -->
    <script>
      window.toast = {
        success: function() {},
        error: function() {},
        info: function() {},
        warning: function() {},
        loading: function() {},
        promise: function() { return Promise.resolve(); },
        custom: function() {},
        dismiss: function() {}
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
